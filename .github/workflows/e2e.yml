name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [atelier-8-tests-e2e]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start MiniShop API and wait for healthcheck
        run: |
          nohup uvicorn minishop.api:app --host 127.0.0.1 --port 8000 >/tmp/minishop.log 2>&1 &
          echo $! > /tmp/minishop.pid
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'

      - name: Run Playwright E2E tests
        run: pytest -m e2e --browser ${{ matrix.browser }} --tracing retain-on-failure --video retain-on-failure --output test-results

      - name: Stop MiniShop API
        if: always()
        run: |
          if [ -f /tmp/minishop.pid ]; then
            kill "$(cat /tmp/minishop.pid)" 2>/dev/null || true
          fi

      - name: Upload test results and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
